<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إحصاءات الدليل</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: transparent; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #0f172a; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px; text-align: center; }

  .title { margin: 0 0 14px; font-size: 2rem; font-weight: 500; color: #0f172a; }
  .title b { color: #0284c7; font-weight: 800; }
  .lead { margin: 0 auto 32px; max-width: 720px; font-size: 1.15rem; font-weight: 600; line-height: 1.8; color: #1e293b; }

  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 36px; }
  .card {
    position: relative; overflow: hidden;
    background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px;
    padding: 28px 16px 24px; cursor: default;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .card::before {
    content: ""; position: absolute; top: 0; right: 0; left: 0; height: 4px;
    background: var(--c); transform: scaleX(0); transform-origin: right;
    transition: transform .3s ease;
  }
  .card:hover { transform: translateY(-6px); box-shadow: 0 14px 30px rgba(15, 23, 42, 0.12); border-color: var(--c); }
  .card:hover::before { transform: scaleX(1); }
  .icon {
    width: 48px; height: 48px; margin: 0 auto 12px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    background: var(--bg); transition: transform .3s ease;
  }
  .card:hover .icon { transform: scale(1.12) rotate(-6deg); }
  .num { font-size: 2.2rem; font-weight: 800; color: var(--c); line-height: 1.2; }
  .label { margin-top: 6px; font-size: 1.05rem; font-weight: 600; color: #334155; }

  .c1 { --c: #0284c7; --bg: #e0f2fe; }
  .c2 { --c: #047857; --bg: #d1fae5; }
  .c3 { --c: #ca8a04; --bg: #fef9c3; }
  .c4 { --c: #7c3aed; --bg: #ede9fe; }

  .btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 28px; border-radius: 10px; text-decoration: none;
    font-size: 1rem; font-weight: 700; color: #ffffff;
    background: #0369a1; box-shadow: 0 4px 12px rgba(3, 105, 161, 0.25);
    transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease;
  }
  .btn:hover { transform: translateY(-3px); background: #0c4a6e; box-shadow: 0 8px 20px rgba(3, 105, 161, 0.35); }
  .btn.alt { background: #047857; box-shadow: 0 4px 12px rgba(4, 120, 87, 0.25); }
  .btn.alt:hover { background: #065f46; box-shadow: 0 8px 20px rgba(4, 120, 87, 0.35); }
  .btn span { transition: transform .2s ease; }
  .btn:hover span { transform: translateX(-4px); }

  @media (max-width: 800px) { .cards { grid-template-columns: repeat(2, 1fr); } .title { font-size: 1.6rem; } }
  @media (max-width: 420px) { .cards { gap: 12px; } .num { font-size: 1.8rem; } .label { font-size: .95rem; } }
</style>
</head>
<body>
<div class="wrap">

  <h2 class="title">دليل التجمعات السكانية الفلسطينية <b>2026</b></h2>
  <p class="lead">استكشف التجمعات السكانية الفلسطينية من خلال خريطة تفاعلية تتيح البحث والوصول إلى المعلومات الجغرافية والإحصائية لكل تجمع</p>

  <div class="cards">
    <div class="card c1"><div class="icon">🏘️</div><div class="num" data-to="631">631</div><div class="label">عدد التجمعات السكانية</div></div>
    <div class="card c2"><div class="icon">🗺️</div><div class="num" data-to="16">16</div><div class="label">عدد المحافظات</div></div>
    <div class="card c3"><div class="icon">⛺</div><div class="num" data-to="173">173</div><div class="label">عدد التجمعات البدوية</div></div>
    <div class="card c4"><div class="icon">🤝</div><div class="num" data-to="16">16</div><div class="label">الجهات المشاركة</div></div>
  </div>

  <div class="btns">
    <a class="btn" target="_top" href="https://experience.arcgis.com/experience/2a4600b14eeb48998f45009606cc6114/page/%D8%A7%D9%84%D8%AF%D9%84%D9%8A%D9%84">📖 استكشف الدليل <span>←</span></a>
    <a class="btn alt" target="_top" href="https://experience.arcgis.com/experience/2a4600b14eeb48998f45009606cc6114/page/%D8%A7%D9%84%D9%85%D9%86%D8%B5%D8%A9-%D8%A7%D9%84%D8%AA%D9%81%D8%A7%D8%B9%D9%84%D9%8A%D8%A9">🧭 المنصة التفاعلية <span>←</span></a>
  </div>

</div>
<script>
  // عدّاد الأرقام: يبدأ من صفر لما تظهر الكروت
  (function () {
    var nums = document.querySelectorAll('.num[data-to]');
    function run(el) {
      var to = +el.getAttribute('data-to'), start = null, dur = 1200;
      function step(t) {
        if (!start) start = t;
        var p = Math.min((t - start) / dur, 1);
        el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    nums.forEach(run);
  })();
</script>
</body>
</html>
